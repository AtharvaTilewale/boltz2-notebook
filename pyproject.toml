[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz2nb"
version = "2.1.3"
description = "Testable core for the Boltz2-Notebook Colab front-ends (YAML builder, runner, analysis, batch)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Atharva Tilewale"}, {name = "Dhaval Patel"}]
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6",
  "biopython>=1.80",
  "pandas>=2",
  "matplotlib>=3.7",
  "requests>=2.28",
]

[project.optional-dependencies]
ligand = ["rdkit>=2023.9"]
viewer = ["py3Dmol>=2"]
engine = ["boltz[cuda]==2.2.1; python_version < '3.13'", "boltz-community[cuda]==2.10.12; python_version >= '3.13'"]
telemetry = ["pynacl>=1.5"]
dev = ["pytest>=7", "pytest-cov", "ruff", "ipython>=8", "ipywidgets>=8", "pynacl>=1.5"]

[project.urls]
Homepage = "https://github.com/AtharvaTilewale/boltz2-notebook"
Issues = "https://github.com/AtharvaTilewale/boltz2-notebook/issues"

[tool.setuptools.packages.find]
include = ["boltz2nb*"]

[tool.setuptools.package-data]
"boltz2nb.ui" = ["assets/*"]     # CSS/JS/HTML of the interface; the notebooks install the package non-editably

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["engine: needs an installed boltz CLI and model cache"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "E701", "E702", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/batch_utils.py" = ["F401", "F403"]
