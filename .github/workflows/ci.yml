name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (no Boltz engine; engine-dependent tests are skipped)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ligand]"
      - name: Lint
        run: ruff check boltz2nb tests scripts/common scripts/batch_utils.py
      - name: Unit tests
        run: pytest --cov=boltz2nb --cov-report=term-missing
      - name: Notebook cells compile
        run: python tools/check_notebooks.py

  install-smoke:
    # Proves the pinned engine requirement resolves on a CPU runner (download only, no prediction).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve engine requirement for this interpreter
        run: |
          python -m pip install --upgrade pip
          REQ=$(python -c "import sys; sys.path.insert(0,'.'); from boltz2nb.install import pick_boltz_requirement; print(pick_boltz_requirement().replace('[cuda]',''))")
          echo "Installing $REQ"
          python -m pip install --dry-run "$REQ" > /dev/null
